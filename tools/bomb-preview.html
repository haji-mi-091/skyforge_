<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>SKYFORGE · 炸弹通用爆炸预览</title>
<style>body{margin:0;background:#8d9ba0;color:#eef3ef;font:14px system-ui}canvas{display:block}aside{position:absolute;top:16px;left:16px;padding:18px;background:#111e24df;max-width:400px;border-radius:10px}h2{margin:0 0 12px;font-size:20px}label{display:inline-flex;align-items:center;gap:6px;margin:6px}button,select,input{accent-color:#ffa15e}button,select{padding:7px;background:#293a42;color:inherit;border:1px solid #638080;border-radius:5px}p{font-size:12px;color:#bccdce;margin-bottom:0}#time{width:230px}</style>
<aside><h2>炸弹 · 通用爆炸</h2><label>弹重 <select id="mass"><option>100</option><option selected>250</option><option>500</option><option>1000</option></select> kg</label><label>环境 <select id="surface"><option value="ground">地面</option><option value="water">水面</option><option value="air">空爆</option></select></label><br><button id="trigger">重新引爆</button> <button id="pause">暂停</button><label><input id="loop" type="checkbox" checked>循环</label><br><label><input id="time" type="range" min="0" max="10" step=".01" value="0"><span id="seconds">0.00 s</span></label><p>鼠标旋转／缩放。贴图火球、烟尘、冲击环和地面焦痕；无粒子发射器。弹重控制视觉规模，不代表工程爆炸计算。</p></aside>
<script type="module">
import * as T from '../vendor/three.module.js';
import {BombExplosionSystem} from '../src/visual/BombExplosion.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x91a6b0);scene.fog=new T.Fog(0x91a6b0,200,600);scene.add(new T.HemisphereLight(0xd2ebff,0x585d43,1.3));
const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000);let azimuth=.67,elevation=.24,distance=120,drag=null;const controls={update(){camera.position.set(Math.sin(azimuth)*Math.cos(elevation)*distance,12+Math.sin(elevation)*distance,Math.cos(azimuth)*Math.cos(elevation)*distance);camera.lookAt(0,12,0);}};controls.update();
renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!drag)return;azimuth-=(e.clientX-drag[0])*.006;elevation=T.MathUtils.clamp(elevation+(e.clientY-drag[1])*.004,.04,1.4);drag=[e.clientX,e.clientY];};renderer.domElement.onpointerup=()=>drag=null;renderer.domElement.onwheel=e=>{distance=T.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),25,350);e.preventDefault();};
const ground=new T.Mesh(new T.PlaneGeometry(1000,1000),new T.MeshStandardMaterial({color:0x777b64,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new T.GridHelper(160,16,0x9caa9c,0x7e8c7e);grid.position.y=.01;scene.add(grid);
const bombs=new BombExplosionSystem(scene),$=id=>document.getElementById(id);let paused=false,effect;
function trigger(){bombs.clear();const surface=$('surface').value;ground.material.color.set(surface==='water'?0x385a6a:0x777b64);grid.visible=surface==='ground';effect=bombs.spawn(new T.Vector3(0,surface==='air'?35:.15,0),{mass:Number($('mass').value),groundHeight:0,surface:surface==='water'?'water':'ground',airburst:surface==='air'});$('time').value=0;}
function setTime(t){effect.age=t;bombs.update(0,camera);$('time').value=t;$('seconds').textContent=t.toFixed(2)+' s';}
$('trigger').onclick=trigger;$('mass').onchange=trigger;$('surface').onchange=trigger;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';};$('time').oninput=()=>{const time=Number($('time').value);paused=true;$('pause').textContent='继续';if(!bombs.active.length)trigger();setTime(time);};
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
trigger();let last=performance.now();function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){if(!bombs.active.length&&$('loop').checked)trigger();bombs.update(dt,camera);if(effect){$('time').value=Math.min(10,effect.age);$('seconds').textContent=Math.min(10,effect.age).toFixed(2)+' s';}}controls.update();renderer.render(scene,camera);requestAnimationFrame(draw);}requestAnimationFrame(draw);
window.__BOMB_PREVIEW__={bombs,scene,renderer,camera,trigger,setTime,set paused(v){paused=v},get effect(){return effect}};window.__READY__=true;
</script></html>
